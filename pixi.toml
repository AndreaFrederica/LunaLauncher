[workspace]
authors = ["AndreaFrederica <andreafrederica@outlook.com>"]
name = "LunaLauncher"
platforms = ["win-64", "linux-64"]
version = "0.1.0"
channels = [
  "conda-forge",
  "https://conda.anaconda.org/conda-forge/label/m2w64-experimental"
]

[dependencies]
cmake = ">=4.2.1,<5"
openssl = ">=3.6.0,<4"
openjdk = "21.*"
python = ">=3.14.2,<3.15"
ninja = ">=1.13.2,<2"
git = ">=2.52.0,<3"
ccache = ">=4.13.6,<5"
dotnet-sdk = ">=10.0.0,<11"

[target.win-64.dependencies]
powershell = ">=7.5.4,<8"

[target.linux-64.dependencies]
c-compiler = ">=1.11.0,<2"
cxx-compiler = ">=1.11.0,<2"
pkg-config = ">=0.29.2,<0.30"

[pypi-dependencies]
aqtinstall = ">=3.3.0, <4"
meson = ">=1.11.1, <2"
ninja = ">=1.13.0, <2"

[tasks.install_qt]
description = "Install Qt"
args = [
  { arg = "profile", default = "release", choices = ["debug", "release", "linux-x64-gcc-release"] },
]
cmd = "python scripts/pixi_meson.py install-qt {{ profile }}"

[tasks.configure]
description = "Configure Meson build directory"
args = [
  { arg = "profile", default = "release", choices = ["debug", "release", "linux-x64-gcc-release"] },
]
cmd = "python scripts/pixi_meson.py configure {{ profile }}"

[tasks.build]
description = "Build with Meson"
args = [
  { arg = "profile", default = "release", choices = ["debug", "release", "linux-x64-gcc-release"] },
]
depends-on = [
  { task = "configure", args = ["{{ profile }}"] },
]
cmd = "python scripts/pixi_meson.py build {{ profile }}"

[tasks.install]
description = "Install and deploy"
args = [
  { arg = "profile", default = "release", choices = ["debug", "release", "linux-x64-gcc-release"] },
]
depends-on = [
  { task = "build", args = ["{{ profile }}"] },
]
cmd = "python scripts/pixi_meson.py install {{ profile }}"

[tasks.deploy]
description = "Deploy runtime files for the selected profile"
args = [
  { arg = "profile", default = "release", choices = ["debug", "release", "linux-x64-gcc-release"] },
]
cmd = "python scripts/pixi_meson.py deploy {{ profile }}"

[tasks.test]
description = "Run built executable to verify it launches"
args = [
  { arg = "profile", default = "debug", choices = ["debug", "release"] },
]
cmd = "python scripts/pixi_meson.py test {{ profile }}"

[tasks.test-install]
description = "Run installed executable to verify install"
args = [
  { arg = "profile", default = "debug", choices = ["debug", "release"] },
]
cmd = "python scripts/pixi_meson.py test-install {{ profile }}"

[tasks.clean]
description = "Clean build directory for a profile"
args = [
  { arg = "profile", default = "release", choices = ["debug", "release", "linux-x64-gcc-release"] },
]
cmd = "python scripts/pixi_meson.py clean {{ profile }}"

[tasks.clean-all]
description = "Remove all build-meson-* and install-* directories"
cmd = "python scripts/pixi_meson.py clean-all"

[tasks.test-debug]
description = "Build + test (debug)"
depends-on = [
  { task = "build", args = ["debug"] },
]
cmd = "python scripts/pixi_meson.py test debug"

[tasks.test-install-debug]
description = "Build + install + test (debug)"
depends-on = [
  { task = "install", args = ["debug"] },
]
cmd = "python scripts/pixi_meson.py test-install debug"

# --- Offline test builds (FOR AUTOMATED TESTING ONLY - disables ownership check) ---

[tasks.configure-test-offline]
description = "Configure offline test build (NO ownership check - TESTING ONLY)"
args = [
  { arg = "profile", default = "debug", choices = ["debug", "release"] },
]
cmd = "python scripts/pixi_meson.py configure {{ profile }}"
env = { LUNA_DISABLE_OWNERSHIP_CHECK = "1", LUNA_BUILD_TESTING = "1" }

[tasks.build-test-offline]
description = "Build offline test launcher (NO ownership check - TESTING ONLY)"
depends-on = [
  { task = "configure-test-offline", args = ["debug"] },
]
cmd = "python scripts/pixi_meson.py build debug"
env = { LUNA_DISABLE_OWNERSHIP_CHECK = "1", LUNA_BUILD_TESTING = "1" }

[tasks.test-offline]
description = "Build + run offline test launcher (TESTING ONLY)"
depends-on = [
  { task = "build-test-offline", args = ["debug"] },
]
cmd = "python scripts/pixi_meson.py test debug"
