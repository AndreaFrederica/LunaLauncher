[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7l'
endian = 'little'

[binaries]
c = '/usr/bin/arm-linux-gnueabihf-gcc'
cpp = '/usr/bin/arm-linux-gnueabihf-g++'
ar = '/usr/bin/arm-linux-gnueabihf-gcc-ar'
strip = '/usr/bin/arm-linux-gnueabihf-strip'
# exe_wrapper = '/usr/bin/qemu-arm'  # uncomment if target binaries can run via QEMU

# Paths above are examples — adjust for your distro and toolchain.

[properties]
sys_root = '/opt/arm-sysroot'
pkg_config_libdir = '/opt/arm-sysroot/usr/lib/pkgconfig'

[built-in options]
c_args = ['-O2']
c_link_args = ['-Wl,--as-needed']
c_std = 'c17'
cpp_std = 'c++20'
warning_level = '3'
