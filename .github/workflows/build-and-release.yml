name: Build and release with Pixi and Meson

run-name: >-
  ${{ github.event_name == 'push'
      && format('Release {0}', github.ref_name)
      || format('Build {0} ({1})', inputs.release_tag || github.sha, inputs.platform) }}

on:
  push:
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        required: true
        default: all
        options:
          - all
          - windows-x64
          - linux-x64
          - macos-arm64
      include_neo_ui:
        description: Include the Neo UI in the packaged build
        type: boolean
        required: true
        default: true
      publish_release:
        description: Publish the artifacts to a GitHub Release
        type: boolean
        required: true
        default: false
      prerelease:
        description: Mark a manually published Release as a prerelease
        type: boolean
        required: true
        default: false
      release_tag:
        description: Release tag (empty uses the Meson project version)
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.meta.outputs.matrix }}
      publish_release: ${{ steps.meta.outputs.publish_release }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      asset_version: ${{ steps.meta.outputs.asset_version }}
      release_revision: ${{ steps.meta.outputs.release_revision }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Resolve targets and release metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SELECTED_PLATFORM: ${{ inputs.platform || 'all' }}
          MANUAL_PUBLISH: ${{ inputs.publish_release || false }}
          MANUAL_PRERELEASE: ${{ inputs.prerelease || false }}
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          case "$SELECTED_PLATFORM" in
            all)
              matrix='{"include":[{"target":"windows-x64","runner":"windows-2022"},{"target":"linux-x64","runner":"ubuntu-22.04"},{"target":"macos-arm64","runner":"macos-26"}]}'
              ;;
            windows-x64)
              matrix='{"include":[{"target":"windows-x64","runner":"windows-2022"}]}'
              ;;
            linux-x64)
              matrix='{"include":[{"target":"linux-x64","runner":"ubuntu-22.04"}]}'
              ;;
            macos-arm64)
              matrix='{"include":[{"target":"macos-arm64","runner":"macos-26"}]}'
              ;;
            *)
              echo "Unsupported platform: $SELECTED_PLATFORM" >&2
              exit 1
              ;;
          esac

          if [[ "$EVENT_NAME" == "push" ]]; then
            publish_release=true
            release_tag="$REF_NAME"
            # A date and optional same-day revision are normal Luna releases.
            if [[ "$release_tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9]{8}(r[0-9]+)?)?$ ]]; then
              prerelease=false
            else
              prerelease=true
            fi
          else
            publish_release="$MANUAL_PUBLISH"
            prerelease="$MANUAL_PRERELEASE"
            release_tag="$MANUAL_TAG"
            if [[ -z "$release_tag" ]]; then
              project_version="$(sed -n "s/^[[:space:]]*version: '\([^']*\)'.*/\1/p" meson.build | head -n 1)"
              test -n "$project_version"
              release_tag="v$project_version"
            fi
          fi

          release_revision=""
          if [[ "$release_tag" =~ -[0-9]{8}r([0-9]+)$ ]]; then
            release_revision="${BASH_REMATCH[1]}"
          fi
          asset_version="$(printf '%s' "$release_tag" | sed 's/[^A-Za-z0-9._-]/-/g')"
          {
            echo "matrix=$matrix"
            echo "publish_release=$publish_release"
            echo "prerelease=$prerelease"
            echo "release_tag=$release_tag"
            echo "asset_version=$asset_version"
            echo "release_revision=$release_revision"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CARGO_BUILD_JOBS: '1'
      LUNA_BUILD_JOBS: '1'
      LUNA_USE_PCH: ${{ runner.os == 'Linux' && 'true' || 'false' }}
      LUNA_BUILD_DIR: build-meson-release
      LUNA_INSTALL_DIR: install-release
      LUNA_MACOS_DEPLOYMENT_TARGET: "13.0"
      LUNA_NEO_UI: ${{ (github.event_name == 'push' || inputs.include_neo_ui) && 'enabled' || 'disabled' }}
      LUNA_RELEASE_REVISION: ${{ needs.prepare.outputs.release_revision }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
          vsversion: 2022

      - name: Cache Qt
        uses: actions/cache@v5.0.4
        with:
          path: third_party/qt
          key: qt-${{ matrix.target }}-${{ hashFiles('scripts/pixi_meson.py') }}

      - name: Cache compiler output
        uses: actions/cache@v5.0.4
        with:
          path: .ccache
          key: ccache-${{ matrix.target }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.target }}-${{ github.ref_name }}-
            ccache-${{ matrix.target }}-

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          cache: true
          frozen: true

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev desktop-file-utils libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libopengl0 xvfb

      - name: Build and install with Meson
        if: runner.os != 'Windows'
        run: pixi run install release

      - name: Build and install with Meson (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $buildScript = @'
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $msvcBin = Join-Path $env:VCToolsInstallDir 'bin\HostX64\x64'
          if (-not (Test-Path (Join-Path $msvcBin 'link.exe'))) {
              throw "MSVC linker not found in $msvcBin"
          }

          $env:PATH = "$msvcBin$([IO.Path]::PathSeparator)$env:PATH"
          python scripts/pixi_meson.py configure release
          python scripts/pixi_meson.py build release
          python scripts/pixi_meson.py install release
          '@

          $encodedBuildScript = [Convert]::ToBase64String(
              [Text.Encoding]::Unicode.GetBytes($buildScript)
          )
          pixi run pwsh -NoProfile -EncodedCommand $encodedBuildScript
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Show Meson build configuration
        run: pixi run meson introspect build-meson-release --buildoptions

      - name: Build standalone installer shell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pixi run installer-shell-build

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET_VERSION: ${{ needs.prepare.outputs.asset_version }}
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $archive = "release-assets/LunaLauncher-Windows-x64-$env:ASSET_VERSION.zip"
          $setup = "release-assets/LunaLauncher-Windows-x64-$env:ASSET_VERSION-Setup.exe"
          $stub = "installer-shell/target/release/luna-installer-shell.exe"
          if (-not (Test-Path $stub)) {
              throw "Installer shell was not built: $stub"
          }
          # These files are per-installation state. A stale marker here would
          # force every fresh release into the system data directory and make
          # the portable setting appear broken on first launch.
          foreach ($marker in @(".luna-use-system-data", "portable.txt", "portable.txt.disabled")) {
              Remove-Item -LiteralPath (Join-Path "install-release" $marker) -Force -ErrorAction SilentlyContinue
          }
          New-Item -ItemType Directory -Force install-release/licenses | Out-Null
          Copy-Item installer-shell/LICENSE-MPL-2.0 install-release/licenses/installer-shell-MPL-2.0.txt -Force
          pixi run cargo run --manifest-path installer-shell/Cargo.toml --release --bin create-zip -- --source install-release --output $archive
          pixi run cargo run --manifest-path installer-shell/Cargo.toml --release --bin assemble-sfx -- --stub $stub --payload $archive --output $setup
          foreach ($artifact in @($archive, $setup)) {
              $hash = (Get-FileHash -Algorithm SHA256 $artifact).Hash.ToLowerInvariant()
              "$hash  $([IO.Path]::GetFileName($artifact))" | Set-Content "$artifact.sha256"
          }
          pixi run python scripts/windows_update_manifest.py --setup $setup --installation install-release --architecture x64

      - name: Package deployed Linux portable directory and update manifest
        if: runner.os == 'Linux'
        shell: bash
        run: pixi run python scripts/pixi_appimage.py release --format portable

      - name: Package Linux AppImage and update manifest
        if: runner.os == 'Linux'
        shell: bash
        env:
          CARGO_BUILD_JOBS: '1'
          LUNA_BUILD_JOBS: '1'
        run: pixi run python scripts/pixi_appimage.py release

      - name: Verify Linux AppImage runtime and update transaction
        if: runner.os == 'Linux'
        shell: bash
        env:
          LUNA_BUILD_TESTING: 'true'
        run: |
          set -euo pipefail
          image="$(find "$PWD/release-assets" -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$image"
          pixi run configure release
          pixi run python scripts/appimage_smoke.py "$image"
          pixi run python tests/appimage_api_smoke.py --image "$image"
          portable="$(find "$PWD/release-assets" -maxdepth 1 -name '*-portable.tar.gz' -print -quit)"
          test -n "$portable"
          pixi run python scripts/portable_smoke.py "$portable"
          if [[ "$LUNA_NEO_UI" == enabled ]]; then
            GDK_BACKEND=x11 xvfb-run -a pixi run python tests/appimage_neo_smoke.py --image "$image"
            GDK_BACKEND=x11 xvfb-run -a pixi run python tests/linux_portable_runtime.py --archive "$portable" --neo
          else
            pixi run python tests/linux_portable_runtime.py --archive "$portable"
          fi

      - name: Validate and sign macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="install-release/LunaLauncher.app"
          executable="$app/Contents/MacOS/lunalauncher"
          plist="$app/Contents/Info.plist"

          test -x "$executable"
          plutil -lint "$plist"
          lipo -verify_arch arm64 "$executable"
          otool -L "$executable"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Package macOS build
        if: runner.os == 'macOS'
        shell: bash
        env:
          ASSET_VERSION: ${{ needs.prepare.outputs.asset_version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          zip_name="LunaLauncher-macOS-arm64-${ASSET_VERSION}.zip"
          dmg_name="LunaLauncher-macOS-arm64-${ASSET_VERSION}.dmg"

          ditto -c -k --sequesterRsrc --keepParent \
            install-release/LunaLauncher.app "release-assets/$zip_name"
          hdiutil create \
            -volname "Luna Launcher" \
            -srcfolder install-release/LunaLauncher.app \
            -ov \
            -format UDZO \
            "release-assets/$dmg_name"
          (
            cd release-assets
            shasum -a 256 "$zip_name" > "$zip_name.sha256"
            shasum -a 256 "$dmg_name" > "$dmg_name.sha256"
          )

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: LunaLauncher-${{ matrix.target }}-${{ needs.prepare.outputs.asset_version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Stop .NET build servers
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: pixi run dotnet build-server shutdown

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - build
    if: ${{ needs.prepare.outputs.publish_release == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: LunaLauncher-*
          path: release-assets
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Luna Launcher ${{ needs.prepare.outputs.release_tag }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
