name: Linux Flatpak

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/flatpak.yml'
      - 'scripts/flatpak/**'
      - 'scripts/pixi_flatpak.py'
      - 'scripts/pixi_appimage.py'
      - 'tests/flatpak_smoke.py'

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-22.04
    env:
      LUNA_BUILD_JOBS: '2'
      CARGO_BUILD_JOBS: '1'
      LUNA_NEO_UI: enabled
      LUNA_USE_PCH: 'true'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          cache: true
          frozen: true
      - uses: actions/cache@v5.0.4
        with:
          path: |
            third_party/qt
            subprojects/packagecache
            .ccache
          key: flatpak-deps-${{ runner.os }}-${{ hashFiles('pixi.lock', 'scripts/pixi_meson.py', 'subprojects/*.wrap') }}
      - name: Install desktop and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev desktop-file-utils libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libopengl0 xvfb flatpak dbus-x11 patchelf
      - name: Build full Flatpak
        run: |
          pixi run flatpak-setup
          pixi run package-flatpak-webui
      - name: Test installed sandbox
        run: |
          set -euo pipefail
          bundle="$(find "$PWD/release-assets" -maxdepth 1 -name '*.flatpak' -print -quit)"
          test -n "$bundle"
          GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a pixi run test-flatpak "$bundle"
      - uses: actions/upload-artifact@v7
        with:
          name: LunaLauncher-Flatpak-x64
          path: |
            release-assets/*.flatpak
            release-assets/*.flatpak.sha256
            release-assets/linux-x64-flatpak.json
          if-no-files-found: error
      - name: Collect build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Flatpak-build-logs
          path: build-meson-webui-release/meson-logs/
